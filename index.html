<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Inventory - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <img src="/logo pic/ChatGPT Image Sep 10, 2026, 11_04_23 PM.png" alt="Gingoog Gadgets logo">
            </div>

            <h1>Store Inventory</h1>
            <p class="subtitle">Inventory Management System</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter your password" required>

                        <button type="button" id="showPassword" class="show-btn">
                            Show
                        </button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" onclick="forgotPassword()">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <div class="footer">
                <p>© 2026 Store Inventory System</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
